services:
  postgres:
    image: postgres:16-alpine
    container_name: oplata_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oplata
      POSTGRES_PASSWORD: oplata_dev_password
      POSTGRES_DB: oplata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: oplata_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
